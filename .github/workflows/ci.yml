name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall -q mock_gps start_local.py
        env:
          API_SECRET_KEY: test-dashboard-secret
          API_ACCESS_KEY: test-api-access-secret
          FLASK_SESSION_SECRET: test-session-secret
      - run: python -m pytest
        env:
          API_SECRET_KEY: test-dashboard-secret
          API_ACCESS_KEY: test-api-access-secret
          FLASK_SESSION_SECRET: test-session-secret
